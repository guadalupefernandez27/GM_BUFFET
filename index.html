<!DOCTYPE html>
<html>
<head>
  <title>GM Catering</title>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">

  <!-- ICONO -->
  <link rel="icon" href="imagenes/icono_buffet.png" type="image/png">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-izq" onclick="volverInicio()">
    <!-- Usamos tu nuevo logo oficial -->
    <img src="imagenes/icono_buffet.png" class="logo-principal" alt="GM Catering Logo">
    <span class="nombre-marca">GM Catering</span>
  </div>

  <div class="header-der" id="header-der" style="display:none;">
    <button id="btn-historial" onclick="verHistorial()" aria-label="Historial de pedidos de hoy"><span class="ico">📄</span><span class="lbl">Historial</span></button>
    <button id="btn-agenda" onclick="verAgenda()" aria-label="Agenda semanal"><span class="ico">📅</span><span class="lbl">Agenda</span></button>
    <button onclick="cerrarSesion()" aria-label="Cerrar sesión"><span class="ico">🚪</span><span class="lbl">Salir</span></button>
  </div>
</div>

<!-- LOGIN -->
<div id="pantalla-login" class="pantalla" style="display:none;">
  <h2>Iniciar sesión</h2>
  <div class="colegio">
    <form id="form-login" onsubmit="iniciarSesion(event)">
      <input id="login-email" name="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="login-clave" name="password" type="password" placeholder="Contraseña" autocomplete="current-password"
             required style="margin-top:8px;">
      <button type="submit">Entrar</button>
      <p id="login-error" style="color:#e00;text-align:center;margin:10px 0 0;"></p>
    </form>
  </div>
</div>

<!-- COLEGIOS -->
<div id="pantalla-colegios" class="pantalla" style="display:none;">
  <h2>Seleccionar Colegio</h2>
  <div id="lista-colegios"></div>
</div>

<!-- PROVEEDORES -->
<div id="pantalla-proveedores" class="pantalla" style="display:none;">
  <div class="sticky-nav">
    <button onclick="volverColegios()">← Volver</button>
  </div>
  
  <h2 id="titulo-colegio"></h2>
  <div id="lista-proveedores"></div>
</div>

<!-- PRODUCTOS -->
<div id="pantalla-productos" class="pantalla" style="display:none;">
  <div class="sticky-nav">
    <button onclick="volverProveedores()">← Volver</button>
  </div>
  
  <div class="chip-colegio" data-chip-colegio></div>
  <h2 id="titulo-proveedor"></h2>
  <div id="productos"></div>
</div>

<!-- CARRITO -->
<div id="pantalla-carrito" class="pantalla" style="display:none;">
  <div class="sticky-nav">
    <button onclick="volverProductos()">← Volver</button>
  </div>
 
  <div class="chip-colegio" data-chip-colegio></div>
  <h2>Carrito</h2>
  <ul id="carrito"></ul>
  <button onclick="copiarPedido()">Copiar Pedido</button>
</div>

<!-- HISTORIAL -->
<div id="pantalla-historial" class="pantalla" style="display:none;">
  <div class="sticky-nav">
    <button onclick="volverInicio()">← Volver</button>
  </div>
  
  <h2>Historial</h2>
  <ul id="historial"></ul>
</div>

<!-- AGENDA -->
<div id="pantalla-agenda" class="pantalla" style="display:none;">
  <div class="sticky-nav">
    <button onclick="volverInicio()">← Volver</button>
  </div>
  
  <h2>Agenda</h2>
  <div id="agenda"></div>
</div>

<!-- BARRA DE CARRITO (fija abajo) -->
<div id="barra-carrito" class="barra-carrito" role="button" tabindex="0" onclick="irCarrito()">
  <span>🛒 Ver carrito <span id="barra-cant" class="cant">0 productos</span></span>
  <span>→</span>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
